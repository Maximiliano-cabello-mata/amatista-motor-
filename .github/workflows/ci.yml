# CI del motor: sin Blender (motor, constructor del complemento y contrato con la
# API y la web) y dentro de Blender (módulo bpy de PyPI).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: amatista-motor-

      # Vecinos para las pruebas de contrato del modelo ligero y de lecciones (vecinos.py).
      - uses: actions/checkout@v5
        with:
          repository: Maximiliano-cabello-mata/amatista-api-
          path: amatista-api-

      # Si la lectura privada está configurada, una avería de checkout debe fallar la CI.
      - name: Comprobar disponibilidad de las lecciones privadas
        id: lecciones
        env:
          CONFIGURADO: ${{ secrets.AMATISTA_WEB_TOKEN != '' }}
        run: |
          echo "disponibles=$CONFIGURADO" >> "$GITHUB_OUTPUT"
          if [ "$CONFIGURADO" != true ]; then
            echo '::notice::Esta CI cubre el repositorio público. Los contratos con las lecciones se comprueban en la CI privada de Amatista.'
            echo 'Contratos con las lecciones privadas: consultar el trabajo **contratos** de la CI web.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v5
        if: steps.lecciones.outputs.disponibles == 'true'
        with:
          repository: Maximiliano-cabello-mata/amatista-recuperada-20261106
          path: amatista-recuperada-20261106
          token: ${{ secrets.AMATISTA_WEB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar pytest
        run: pip install pytest

      - name: Pruebas del motor y del constructor del complemento
        working-directory: amatista-motor-
        run: python -m pytest -q -rs engine/tests addon/tests

  addon-blender:
    # El complemento dentro de Blender de verdad (sin ventana): registro,
    # prácticas, «Ver el ejemplo», modo Author y paneles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Bibliotecas que bpy necesita en Linux
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Instalar bpy (Blender 5.0 como módulo de Python)
        run: pip install bpy==5.0.1

      - name: Complemento dentro de Blender
        run: python addon/tests/en_blender.py

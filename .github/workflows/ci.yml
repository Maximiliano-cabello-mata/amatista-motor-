# CI del motor: sin Blender (motor, constructor del complemento y contrato con la
# API) y dentro de Blender (módulo bpy de PyPI).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: amatista-motor-

      # Vecino para la prueba de contrato del modelo ligero (vecinos.py).
      - uses: actions/checkout@v4
        with:
          repository: Maximiliano-cabello-mata/amatista-api-
          path: amatista-api-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar pytest
        run: pip install pytest

      - name: Pruebas del motor y del constructor del complemento
        working-directory: amatista-motor-
        run: python -m pytest -q -rs engine/tests addon/tests

  addon-blender:
    # El complemento dentro de Blender de verdad (sin ventana): registro,
    # prácticas, «Ver el ejemplo», modo Author y paneles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bibliotecas que bpy necesita en Linux
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Instalar bpy (Blender 5.0 como módulo de Python)
        run: pip install bpy==5.0.1

      - name: Complemento dentro de Blender
        run: python addon/tests/en_blender.py

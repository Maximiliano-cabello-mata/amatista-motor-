# CI del motor: sin Blender (motor, constructor del complemento y contrato con la
# API y la web) y dentro de Blender (módulo bpy de PyPI).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: amatista-motor-

      # Vecinos para las pruebas de contrato del modelo ligero y de lecciones (vecinos.py).
      - uses: actions/checkout@v4
        with:
          repository: Maximiliano-cabello-mata/amatista-api-
          path: amatista-api-

      # El repositorio de la web es privado: el token de este flujo no lo puede leer.
      # Con el secreto AMATISTA_WEB_TOKEN (un token con lectura de ese repositorio) se
      # clona y corren las pruebas de contrato con las lecciones. Sin él, este paso
      # falla sin detener el trabajo y esas pruebas se saltan con su aviso.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Maximiliano-cabello-mata/amatista-recuperada-20261106
          path: amatista-recuperada-20261106
          token: ${{ secrets.AMATISTA_WEB_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar pytest
        run: pip install pytest

      - name: Pruebas del motor y del constructor del complemento
        working-directory: amatista-motor-
        run: python -m pytest -q -rs engine/tests addon/tests

  addon-blender:
    # El complemento dentro de Blender de verdad (sin ventana): registro,
    # prácticas, «Ver el ejemplo», modo Author y paneles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bibliotecas que bpy necesita en Linux
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Instalar bpy (Blender 5.0 como módulo de Python)
        run: pip install bpy==5.0.1

      - name: Complemento dentro de Blender
        run: python addon/tests/en_blender.py

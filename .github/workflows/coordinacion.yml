name: Coordinación entre repositorios
on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  seguimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Revisar los repositorios y publicar el resumen de esta ejecución
        uses: Maximiliano-cabello-mata/amatista-g7b-etl/.github/actions/coordinacion@12b88a8feb2865fcad7ecd5c6957852ab1c2f011
